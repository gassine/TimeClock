services:
  timeclock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timeclock-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Point to a persistent volume for the SQLite database
      - DATABASE_URL=file:/app/db/prod.db
      # Add other env vars here, e.g.
      # - NEXTAUTH_SECRET=changeme
      # - NEXTAUTH_URL=http://localhost:3000
    volumes:
      # Mount the 'db' directory to persist the SQLite database file
      - ./db:/app/db
      # Mount the uploads directory to persist user-uploaded files (images, attachments)
      - ./uploads:/app/public/uploads
    # You can add a healthcheck if desired
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
