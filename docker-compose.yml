services:
  timeclock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timeclock-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # SQLite database stored in a persistent volume
      - DATABASE_URL=file:/app/db/prod.db
      # REQUIRED: Set this to a long random secret string. Never share it.
      # Generate one at: https://generate-secret.vercel.app/64
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      # Persist the SQLite database file across container restarts
      - ./db:/app/db
      # Persist uploaded files (images, attachments) across container restarts
      - ./uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/logout"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
